name: Sync to Hugging Face Hub

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install huggingface_hub
        run: python -m pip install --no-cache-dir huggingface_hub

      - name: Upload to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        shell: python
        run: |
          import os
          from huggingface_hub import upload_folder

          token = os.environ.get("HF_TOKEN", "").strip()
          if not token:
              raise SystemExit(
                  "HF_TOKEN secret is missing or empty. Configure HF_TOKEN in GitHub repository secrets."
              )

          upload_folder(
              folder_path=".",
              repo_id="ImdataScientistSachin/Ratina_face",
              repo_type="space",
              token=token,
              ignore_patterns=[
                  ".git/*",
                  ".github/*",
                  ".pytest_cache/*",
                  ".ruff_cache/*",
                  "__pycache__/*",
                  "*.pyc",
                  "examples/*",
                  "tests/*",
                  "output/*",
                  "mlruns/*",
                  "pytest*.txt",
                  "*.log",
                  ".env*",
                  "upload_to_hf.py",
                  "MLOPS_STRATEGY.md",
                  "requirements-dev.txt",
              ],
              commit_message="deploy: sync from GitHub Actions",
          )
          print("Upload to Hugging Face Space succeeded.")
